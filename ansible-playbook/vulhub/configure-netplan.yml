---
# Configure SINGLE-NIC routing on all Vulhub Ubuntu 24.04 VMs.
#
# 2026-07 revision: the second (internet) NIC is DISCONNECTED at the vCenter
# level, and egress policy on the 192.168.77.0/24 VLAN allows ONLY the FINKI
# NTP server (no general internet). So:
#   - management NIC (holds the 192.168.77.x address Ansible connects over):
#     now owns the DEFAULT route via 192.168.77.1. The old per-subnet return
#     routes are gone - the default covers them.
#   - legacy internet NIC: removed from netplan; if it still holds a stale
#     address/route (netplan does not flush interfaces it stops managing),
#     we flush it after apply. Remove the adapter in vCenter when convenient.
#
# SAFETY: `netplan try` auto-reverts after netplan_try_timeout seconds if
# connectivity is lost, and serial:1 limits blast radius to one host. The
# mgmt NIC keeps its DHCP address (identity by MAC), so the SSH session
# survives the apply - only its routes change, and the controller is on the
# directly-connected 192.168.77.0/24, which needs no route at all.

- name: Configure single-NIC routing (management carries everything)
  hosts: vulhub
  serial: 1
  become: true
  gather_facts: true

  vars:
    mgmt_gateway: 192.168.77.1
    mgmt_ip: "{{ ansible_host }}"
    ntp_ip: 194.149.136.252            # FINKI NTP - the only allowed egress
    netplan_file: /etc/netplan/50-cloud-init.yaml
    netplan_try_timeout: 120

  tasks:
    # Detection avoids `map('extract', ansible_facts)`, which breaks on
    # interface names containing hyphens (e.g. docker bridges like
    # br-7fad0a555904 -> fact key ansible_br_7fad0a555904). We work from the
    # interface NAME list, filter to physical NICs by name pattern, and look
    # up each candidate's facts via the underscore-normalized key.
    - name: Initialize interface facts (so later checks degrade gracefully)
      ansible.builtin.set_fact:
        mgmt_iface: ""
        legacy_iface: ""

    - name: Build list of candidate physical NICs (en*/eth*, excludes bridges/docker/virtual)
      ansible.builtin.set_fact:
        phys_ifaces: >-
          {{ ansible_facts.interfaces
             | select('match', '^(en|eth)')
             | reject('match', '^(br|docker|veth|virbr|lo)')
             | list }}

    - name: Resolve management interface by matching its IPv4 address
      ansible.builtin.set_fact:
        mgmt_iface: "{{ item }}"
      loop: "{{ phys_ifaces }}"
      when:
        - ansible_facts[item | replace('-', '_')].ipv4 is defined
        - ansible_facts[item | replace('-', '_')].ipv4.address == mgmt_ip

    - name: Resolve legacy internet interface, if the vNIC is still attached
      # Optional: only used for post-apply cleanup. Empty is fine (e.g. after
      # the adapter has been removed from the VM).
      ansible.builtin.set_fact:
        legacy_iface: "{{ item }}"
      loop: "{{ phys_ifaces }}"
      when:
        - item != mgmt_iface
        - legacy_iface | length == 0

    - name: Show what was detected (sanity check)
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: management={{ mgmt_iface }}
          ({{ mgmt_ip }}), legacy={{ legacy_iface | default('none', true) }}

    - name: Fail early if the management interface was not found
      ansible.builtin.assert:
        that:
          - mgmt_iface | length > 0
        fail_msg: >-
          Could not detect the management interface on {{ inventory_hostname }}
          (no physical NIC holds {{ mgmt_ip }}). Skipping to avoid a lockout.
          Inspect this host manually.

    - name: Back up existing netplan file
      ansible.builtin.copy:
        src: "{{ netplan_file }}"
        dest: "{{ netplan_file }}.bak-{{ ansible_date_time.iso8601_basic_short }}"
        remote_src: true
        mode: '0600'
      failed_when: false

    - name: Render single-NIC netplan config
      ansible.builtin.template:
        src: templates/netplan-single-nic.yaml.j2
        dest: "{{ netplan_file }}"
        owner: root
        group: root
        mode: '0600'
      register: netplan_render

    - name: Apply netplan with auto-revert safety net
      # `netplan try` reverts automatically if we lose the connection, so a bad
      # render can't permanently lock us out. We auto-accept only if the SSH
      # session survives the apply (which it will when routing is correct).
      ansible.builtin.shell: >-
        netplan try --timeout {{ netplan_try_timeout }} < /dev/null ||
        netplan apply
      when: netplan_render.changed
      register: netplan_apply
      changed_when: netplan_render.changed

    # After the first apply, systemd-networkd on these images sometimes needs
    # a second nudge to fully take the new config (hand-verified behavior in
    # this environment - removing this nudge left hosts with NO default route
    # until it was run manually). Harmless if the config is already active.
    - name: Nudge netplan again so networkd fully applies the config
      ansible.builtin.command: netplan apply
      when:
        - not ansible_check_mode
        - netplan_render.changed
      changed_when: false

    - name: Flush stale state off the legacy NIC (netplan won't do it)
      # When an interface disappears from the netplan config, networkd stops
      # managing it but does NOT remove its existing address or routes - they
      # linger until reboot. Flush explicitly so no stale default route via
      # the dead NIC can compete with the new one.
      ansible.builtin.shell: |
        ip route del default dev {{ legacy_iface }} 2>/dev/null || true
        ip addr flush dev {{ legacy_iface }} 2>/dev/null || true
        ip link set {{ legacy_iface }} down 2>/dev/null || true
      when:
        - not ansible_check_mode
        - legacy_iface | length > 0
      changed_when: false

    # The verification tasks below only make sense after a REAL apply. In
    # --check mode the apply is skipped, so we skip the checks too.
    - name: Verify the default route uses the management interface
      # shell + 2>&1 so a failure shows WHY (e.g. "Network is unreachable"
      # = no default route at all) instead of an empty string.
      ansible.builtin.shell: "ip route get {{ ntp_ip }} 2>&1"
      register: route_check
      changed_when: false
      until: >-
        'dev ' + mgmt_iface in route_check.stdout
        and 'via ' + mgmt_gateway in route_check.stdout
      retries: 10
      delay: 3
      failed_when: false
      when: not ansible_check_mode

    - name: Assert egress goes via {{ mgmt_gateway }} on the management NIC
      ansible.builtin.assert:
        that:
          - "'dev ' + mgmt_iface in route_check.stdout"
          - "'via ' + mgmt_gateway in route_check.stdout"
        fail_msg: >-
          Default route on {{ inventory_hostname }} not via {{ mgmt_gateway }}
          dev {{ mgmt_iface }} (got: {{ route_check.stdout }}). Investigate
          before continuing.
        success_msg: "Egress on {{ inventory_hostname }} via {{ mgmt_iface }} -> {{ mgmt_gateway }} OK"
      when: not ansible_check_mode

    - name: Confirm FINKI NTP is reachable (only allowed egress; no curl test - internet is blocked by policy)
      # Sends one real NTP client packet (mode 3) and waits for the reply.
      # python3 is guaranteed present (gather_facts already used it).
      ansible.builtin.command: >-
        python3 -c "import socket;
        s=socket.socket(socket.AF_INET, socket.SOCK_DGRAM);
        s.settimeout(5);
        s.sendto(b'\x1b' + 47*b'\x00', ('{{ ntp_ip }}', 123));
        d, a = s.recvfrom(48);
        print('NTP OK from', a[0], '-', len(d), 'bytes')"
      register: ntp_test
      changed_when: false
      failed_when: ntp_test.rc != 0
      when: not ansible_check_mode

    - name: Summary
      ansible.builtin.debug:
        msg:
          - "{{ inventory_hostname }} ({{ mgmt_ip }})"
          - "route: {{ route_check.stdout | default('?') | trim }}"
          - "ntp: {{ ntp_test.stdout | default('?') | trim }}"
      when: not ansible_check_mode
