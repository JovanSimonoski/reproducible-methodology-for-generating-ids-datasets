---
# Set a unique hostname on each VM, derived from its inventory name
# (e.g. vulhub-1-1, vulhub-2-1, ...). Fixes the cloned-template problem
# where every host reports the same name (vulhub-ubuntu-server), which makes
# logs in VictoriaLogs indistinguishable.

- name: Set unique hostnames
  hosts: vulhub
  become: true
  gather_facts: true

  tasks:
    - name: Set the system hostname to the inventory name
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Ensure hostname resolves locally in /etc/hosts
      # Point 127.0.1.1 at the new hostname so `hostname -f`, sudo, and other
      # tools resolve it without complaint.
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s'
        line: "127.0.1.1 {{ inventory_hostname }}"
        state: present

    - name: Confirm the running hostname changed
      ansible.builtin.command: hostname
      register: hn
      changed_when: false

    - name: Show result
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} now reports hostname: {{ hn.stdout }}"
