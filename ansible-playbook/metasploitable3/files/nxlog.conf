## NXLog CE config - ship Windows Event Log to VictoriaLogs (Metasploitable 3)
## Reads System, Application, Security channels, converts each event to JSON,
## and POSTs to the VictoriaLogs JSON stream API on 9428. Tagged per-host by
## Hostname (VictoriaLogs stream field) and uses the event's own timestamp.

## ROOT is the NXLog install dir. On 64-bit Windows the MSI installs to
## "Program Files (x86)\nxlog". Adjust if you used a custom INSTALLDIR.
define ROOT C:\Program Files (x86)\nxlog

Moduledir %ROOT%\modules
CacheDir  %ROOT%\data
Pidfile   %ROOT%\data\nxlog.pid
SpoolDir  %ROOT%\data
LogFile   %ROOT%\data\nxlog.log
LogLevel  INFO

## JSON formatting extension
<Extension json>
    Module  xm_json
</Extension>

## Input: Windows Event Log (Vista/2008+ API). SavePos remembers position
## across restarts (no data loss / no dupes). Query selects the 3 channels.
<Input eventlog>
    Module      im_msvistalog
    SavePos     TRUE
    Query       <QueryList>\
                    <Query Id="0">\
                        <Select Path="System">*</Select>\
                        <Select Path="Application">*</Select>\
                        <Select Path="Security">*</Select>\
                    </Query>\
                </QueryList>
    # Build the JSON payload VictoriaLogs expects: a "message" field, a
    # "hostname" stream field, and an ISO8601 "timestamp" from the event time.
    Exec $hostname = hostname();
    Exec $timestamp = strftime($EventTime, "%Y-%m-%dT%H:%M:%SZ");
    # Keep the human-readable message; VictoriaLogs uses _msg_field=Message.
    Exec if not defined($Message) $Message = to_json();
    Exec $raw_event = to_json();
</Input>

## Disk buffer so nothing is lost if VictoriaLogs is briefly unreachable.
<Processor buffer>
    Module   pm_buffer
    MaxSize  102400
    Type     disk
    WarnLimit 81920
</Processor>

## Output: HTTP POST to VictoriaLogs JSON stream ingestion on 9428.
## _stream_fields=hostname groups per machine; _msg_field=Message is the log
## body; _time_field=timestamp uses the event's own time.
<Output vlogs>
    Module      om_http
    URL         http://192.168.85.125:9428/insert/jsonline?_stream_fields=hostname&_msg_field=Message&_time_field=timestamp
    ContentType application/x-ndjson
    # Emit each event as one JSON object (newline-delimited) so the jsonline
    # endpoint parses it line by line.
    Exec        $raw = to_json(); $raw;
</Output>

<Route eventlog_to_vlogs>
    Path eventlog => buffer => vlogs
</Route>
